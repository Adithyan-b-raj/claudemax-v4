<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedrock Simple - Key Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #fff; }
    .card { background: #1a1a1a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #2a2a2a; }
    .card h2 { font-size: 1rem; color: #888; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 150px; }
    label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.6rem 0.8rem; background: #0f0f0f; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 0.95rem; }
    input:focus { outline: none; border-color: #4a9eff; }
    button { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #4a9eff; color: #fff; }
    .btn-primary:hover { background: #3a8eef; }
    .btn-danger { background: #ff4a4a; color: #fff; }
    .btn-danger:hover { background: #e03a3a; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-secondary:hover { background: #444; }
    .key-list { margin-top: 1rem; }
    .key-item { background: #0f0f0f; padding: 1rem; border-radius: 8px; margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .key-info { flex: 1; min-width: 200px; }
    .key-name { font-weight: 600; color: #fff; margin-bottom: 0.3rem; }
    .key-meta { font-size: 0.85rem; color: #666; }
    .token-bar-wrap { margin-top: 0.4rem; background: #222; border-radius: 4px; height: 6px; width: 200px; max-width: 100%; }
    .token-bar { height: 6px; border-radius: 4px; background: #4a9eff; transition: width 0.3s; }
    .token-bar.warn { background: #ffaa4a; }
    .token-bar.full { background: #ff4a4a; }
    .edit-limit-row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
    .edit-limit-row input { width: 120px; padding: 0.35rem 0.6rem; font-size: 0.85rem; }
    .token-breakdown { margin-top: 0.3rem; font-size: 0.78rem; color: #555; display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .token-breakdown span { white-space: nowrap; }
    .token-in { color: #4a9eff; }
    .token-out { color: #4aff9e; }
    .token-cache { color: #ffaa4a; }
    .key-value { font-family: monospace; font-size: 0.85rem; background: #1a1a1a; padding: 0.4rem 0.6rem; border-radius: 4px; color: #4a9eff; word-break: break-all; }
    .actions { display: flex; gap: 0.5rem; }
    .login-form { max-width: 400px; margin: 4rem auto; }
    .hidden { display: none; }
    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .alert-success { background: #1a3a1a; color: #4aff4a; }
    .alert-error { background: #3a1a1a; color: #ff4a4a; }
    .empty { text-align: center; color: #666; padding: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-view" class="login-form">
      <div class="card">
        <h2>Admin Login</h2>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label>Admin Secret</label>
          <input type="password" id="admin-secret" placeholder="Enter admin secret">
        </div>
        <button class="btn-primary" onclick="login()" style="width: 100%;">Login</button>
      </div>
    </div>

    <div id="dashboard-view" class="hidden">
      <h1>Bedrock Simple - Key Management</h1>

      <div id="alert" class="alert hidden"></div>

      <div class="card">
        <h2>Create New API Key</h2>
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="key-name" placeholder="my-app">
          </div>
          <div class="form-group">
            <label>Expires In (days)</label>
            <input type="number" id="key-days" value="7" min="1" max="365">
          </div>
          <div class="form-group">
            <label>Token Limit (0 = unlimited)</label>
            <input type="number" id="key-token-limit" value="0" min="0">
          </div>
          <div class="form-group" style="display: flex; align-items: flex-end;">
            <button class="btn-primary" onclick="createKey()">Create Key</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Active Keys</h2>
        <div id="key-list" class="key-list">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let adminToken = localStorage.getItem('adminToken') || '';

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: {
          'Authorization': `Bearer ${adminToken}`,
          'Content-Type': 'application/json',
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert alert-${type}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    async function login() {
      adminToken = document.getElementById('admin-secret').value;
      const data = await api('GET', '/admin/keys');
      if (data.error) {
        showAlert('Invalid admin secret', 'error');
        return;
      }
      localStorage.setItem('adminToken', adminToken);
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      loadKeys();
    }

    async function loadKeys() {
      const data = await api('GET', '/admin/keys');
      if (data.error) {
        document.getElementById('key-list').innerHTML = '<div class="empty">Error loading keys</div>';
        return;
      }
      if (!data.keys || data.keys.length === 0) {
        document.getElementById('key-list').innerHTML = '<div class="empty">No keys yet</div>';
        return;
      }
      document.getElementById('key-list').innerHTML = data.keys.map(k => {
        const used = k.tokensUsed ?? 0;
        const limit = k.tokenLimit ?? 0;
        const input = k.inputTokens ?? 0;
        const output = k.outputTokens ?? 0;
        const cache = k.cacheTokens ?? 0;
        const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
        const barClass = pct >= 100 ? 'full' : pct >= 80 ? 'warn' : '';
        const tokenText = limit > 0
          ? `${used.toLocaleString()} / ${limit.toLocaleString()} tokens`
          : `${used.toLocaleString()} tokens used (unlimited)`;
        const breakdown = (input > 0 || output > 0 || cache > 0)
          ? `<div class="token-breakdown">
               <span class="token-in">In: ${input.toLocaleString()}</span>
               <span class="token-out">Out: ${output.toLocaleString()}</span>
               ${cache > 0 ? `<span class="token-cache">Cache: ${cache.toLocaleString()}</span>` : ''}
             </div>`
          : '';
        return `
        <div class="key-item">
          <div class="key-info">
            <div class="key-name">${escapeHtml(k.name)}</div>
            <div class="key-meta">Expires: ${new Date(k.expiresAt).toLocaleDateString()} &nbsp;·&nbsp; ${tokenText}</div>
            ${limit > 0 ? `<div class="token-bar-wrap"><div class="token-bar ${barClass}" style="width:${pct}%"></div></div>` : ''}
            ${breakdown}
            <div class="key-value">${k.apiKey}</div>
          </div>
          <div class="actions">
            <button class="btn-secondary" onclick="copyKey('${k.apiKey}')">Copy</button>
            <button class="btn-secondary" onclick="toggleEditLimit('${k.apiKey}')">Edit Limit</button>
            <button class="btn-secondary" onclick="resetTokens('${k.apiKey}')">Reset</button>
            <button class="btn-danger" onclick="revokeKey('${k.apiKey}')">Revoke</button>
          </div>
          <div id="edit-limit-${k.apiKey}" class="edit-limit-row hidden">
            <input type="number" id="limit-input-${k.apiKey}" value="${limit}" min="0" placeholder="0 = unlimited">
            <button class="btn-primary" onclick="saveLimit('${k.apiKey}')">Save</button>
            <button class="btn-secondary" onclick="toggleEditLimit('${k.apiKey}')">Cancel</button>
          </div>
        </div>`;
      }).join('');
    }

    async function createKey() {
      const name = document.getElementById('key-name').value || 'api-key';
      const days = parseInt(document.getElementById('key-days').value) || 7;
      const tokenLimit = parseInt(document.getElementById('key-token-limit').value) || 0;
      const data = await api('POST', '/admin/create', { name, days, tokenLimit });
      if (data.error) {
        showAlert(data.error, 'error');
        return;
      }
      showAlert(`Key created: ${data.apiKey}`, 'success');
      loadKeys();
    }

    async function revokeKey(apiKey) {
      if (!confirm('Revoke this key?')) return;
      await api('POST', '/admin/revoke', { apiKey });
      loadKeys();
    }

    async function resetTokens(apiKey) {
      if (!confirm('Reset token count to 0?')) return;
      await api('POST', '/admin/reset-tokens', { apiKey });
      loadKeys();
    }

    function toggleEditLimit(apiKey) {
      const row = document.getElementById(`edit-limit-${apiKey}`);
      row.classList.toggle('hidden');
    }

    async function saveLimit(apiKey) {
      const val = parseInt(document.getElementById(`limit-input-${apiKey}`).value) || 0;
      const data = await api('POST', '/admin/update-token-limit', { apiKey, tokenLimit: val });
      if (data.error) { showAlert(data.error, 'error'); return; }
      showAlert('Token limit updated', 'success');
      loadKeys();
    }

    function copyKey(key) {
      navigator.clipboard.writeText(key);
      showAlert('Copied to clipboard', 'success');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }

    // Auto-login if token exists
    if (adminToken) {
      api('GET', '/admin/keys').then(data => {
        if (!data.error) {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('dashboard-view').classList.remove('hidden');
          loadKeys();
        }
      });
    }
  </script>
</body>
</html>
